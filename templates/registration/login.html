{% extends "base.html" %}
{% block title %}Login | TalentLedger{% endblock %}

{% block content %}
<div class="card" style="max-width: 440px; margin: 2.5rem auto;">
  <h2>Welcome Back</h2>
  <p class="muted">Log in to manage your skills, credits, and bookings.</p>

  <form id="login-form" method="post">
    {% csrf_token %}

    <label for="username">Username</label>
    <input id="username" type="text" required placeholder="e.g. demo_learner_01" />

    <label for="password">Password</label>
    <input id="password" type="password" required placeholder="••••••••" />

    <button class="btn" type="submit" style="width: 100%;">Log In</button>
  </form>

  <p class="muted" style="margin-top: 1rem; margin-bottom: 0; font-size: 0.9rem;">
    Don't have an account? <a href="/register/" style="color: #a5b4fc;">Sign up for 3 free credits</a>
  </p>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  function getCsrfToken() {
    const input = document.querySelector("#login-form input[name='csrfmiddlewaretoken']");
    if (input && input.value) return input.value;
    const match = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]*)/);
    return match ? decodeURIComponent(match[1]) : "";
  }

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const csrfToken = getCsrfToken();

    try {
      const data = await apiRequest("/api/auth/login/", {
        method: "POST",
        headers: csrfToken ? { "X-CSRFToken": csrfToken } : {},
        body: JSON.stringify({ username, password }),
      });

      const user = data.user || data;
      setCurrentUser(user);
      showMsg(`Logged in as ${user.username}! Redirecting...`);

      const params = new URLSearchParams(window.location.search);
      const nextUrl = params.get("next");
      const destination = nextUrl && nextUrl.startsWith("/") ? nextUrl : "/dashboard/";

      setTimeout(() => {
        window.location.href = destination;
      }, 600);
    } catch (err) {
      showMsg(err.message, true);
    }
  });
</script>
{% endblock %}
