{% extends "base.html" %}
{% block title %}Skills | TalentLedger{% endblock %}

{% block content %}
<div class="card">
  <h2>All Skills</h2>
  <p class="muted">Explore skills shared by learners and instructors across TalentLedger.</p>
  <div style="display: flex; gap: 0.75rem; flex-wrap: wrap;">
    <a class="btn btn-sm" href="/marketplace/">Open Marketplace & Book</a>
    <a class="btn btn-sm" href="/add-skill/">+ Offer a Skill</a>
  </div>
</div>

<div id="all-skills-grid" class="grid">
  <div class="card"><p class="muted" style="margin-bottom: 0;">Loading skills...</p></div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  async function loadAllSkills() {
    const grid = document.getElementById("all-skills-grid");
    try {
      const data = await apiRequest("/api/skills/");
      const skills = Array.isArray(data) ? data : (data.results || []);

      if (!skills.length) {
        grid.innerHTML = `<div class="card"><p class="muted" style="margin-bottom: 0;">No skills available yet.</p></div>`;
        return;
      }

      grid.innerHTML = skills.map(skill => {
        const title = skill.title || skill.name || "Untitled Skill";
        const ownerName = skill.owner_username || skill.user_username || (skill.user && skill.user.username) || `User #${skill.user || ""}`;
        return `
          <div class="card" style="display: flex; flex-direction: column; justify-content: space-between; margin-bottom: 0;">
            <div>
              <span class="badge" style="display: inline-block; margin-bottom: 0.75rem;">${skill.category || "Skill"}</span>
              <h3>${title}</h3>
              <p class="muted" style="font-size: 0.92rem;">${skill.description || "Peer learning session."}</p>
            </div>
            <div>
              <p class="muted" style="font-size: 0.85rem; margin-bottom: 0.75rem;">Instructor: <strong>@${ownerName}</strong></p>
              <a class="btn btn-sm" href="/marketplace/">Book in Marketplace</a>
            </div>
          </div>
        `;
      }).join("");
    } catch (err) {
      showMsg(err.message, true);
    }
  }

  document.addEventListener("DOMContentLoaded", loadAllSkills);
</script>
{% endblock %}
