{% extends "base.html" %}
{% block title %}Sign Up | TalentLedger{% endblock %}

{% block content %}
<div class="card" style="max-width: 440px; margin: 2.5rem auto;">
  <h2>Create Account</h2>
  <p class="muted">Get 3 free study credits immediately on sign-up.</p>

  <form id="signup-form">
    <label for="username">Username</label>
    <input id="username" type="text" required placeholder="Choose a username" />

    <label for="email">Email (optional)</label>
    <input id="email" type="email" placeholder="you@example.com" />

    <label for="password">Password</label>
    <input id="password" type="password" required placeholder="Create a password" />

    <button class="btn" type="submit" style="width: 100%;">Create Account</button>
  </form>

  <p class="muted" style="margin-top: 1rem; margin-bottom: 0; font-size: 0.9rem;">
    Already have an account? <a href="/accounts/login/" style="color: #a5b4fc;">Log in</a>
  </p>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  document.getElementById("signup-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const payload = { username, password };
      if (email) payload.email = email;

      const data = await apiRequest("/api/auth/signup/", {
        method: "POST",
        body: JSON.stringify(payload),
      });

      const user = data.user || data;
      if (user.study_credits === undefined) user.study_credits = 3;
      setCurrentUser(user);
      showMsg("Account created with 3 study credits! Redirecting...");
      setTimeout(() => {
        window.location.href = "/dashboard/";
      }, 600);
    } catch (err) {
      showMsg(err.message, true);
    }
  });
</script>
{% endblock %}
