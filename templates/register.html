{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-6 text-center">Create Account</h2>

    <form method="post">
        {% csrf_token %}

        {% if form.errors %}
            <div class="bg-red-100 text-red-600 p-4 mb-4 rounded text-sm">
                {% for field in form %}
                    {% for error in field.errors %}
                        <p>{{ error }}</p>
                    {% endfor %}
                {% endfor %}
            </div>
        {% endif %}

        <div class="mb-4">
            <label class="block text-gray-700 font-bold mb-2">Username</label>
            {{ form.username }}
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 font-bold mb-2">Password</label>
            {{ form.password1 }}
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 font-bold mb-2">Confirm Password</label>
            {{ form.password2 }}
        </div>
        
        <button type="submit" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 font-bold">
            Sign Up
        </button>
    </form>
</div>
{% endblock %}
