{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto py-16 px-6">
    <h1 class="text-4xl font-bold mb-6">Get in Touch</h1>
    <p class="text-gray-600 mb-8">Have questions about the TalentLedger ecosystem? Reach out to our team.</p>
    <form class="space-y-4">
        <input type="text" placeholder="Your Name" class="w-full p-3 border rounded-lg">
        <input type="email" placeholder="Your Email" class="w-full p-3 border rounded-lg">
        <textarea placeholder="Message" class="w-full p-3 border rounded-lg h-32"></textarea>
        <button class="bg-blue-600 text-white px-8 py-3 rounded-lg font-bold hover:bg-blue-700">Send Message</button>
    </form>
</div>
{% endblock %}
