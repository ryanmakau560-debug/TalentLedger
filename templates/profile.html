{% extends "base.html" %}
{% block title %}Profile | TalentLedger{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 1.5rem auto;">
  <h2>Your Profile</h2>
  <p class="muted">Account details and study credit balance.</p>

  <div id="profile-details">
    <p class="muted" style="margin-bottom: 0;">Loading profile...</p>
  </div>

  <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.25rem;">
    <a class="btn btn-sm" href="/dashboard/">Dashboard</a>
    <a class="btn btn-sm" href="/add-skill/">Add Skill</a>
    <a class="btn btn-sm" href="/marketplace/">Marketplace</a>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const me = getCurrentUser();
    const box = document.getElementById("profile-details");

    if (!me) {
      box.innerHTML = `<p class="muted" style="margin-bottom: 0;">You are not logged in. <a href="/accounts/login/" style="color: #a5b4fc;">Log in here</a>.</p>`;
      return;
    }

    box.innerHTML = `
      <p style="margin-bottom: 0.6rem;"><strong>Username:</strong> @${me.username}</p>
      <p style="margin-bottom: 0.6rem;"><strong>Email:</strong> ${me.email || "Not set"}</p>
      <p style="margin-bottom: 0;"><strong>Study Credits:</strong> <span class="badge">${me.study_credits ?? 0} Credits</span></p>
    `;
  });
</script>
{% endblock %}
