<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>TalentLedger</title>
</head>
<body class="bg-gray-100">
<nav class="bg-gray-800 p-4 text-white">
    <div class="container mx-auto flex gap-4">
        <a href="{% url 'dashboard' %}" class="hover:text-blue-300">Dashboard</a>

        <div class="relative group">
            <button class="hover:text-blue-300">Account ▼</button>
            
            <div class="absolute left-0 mt-2 w-48 bg-white text-gray-800 rounded-lg shadow-xl hidden group-hover:block z-10">
                <a href="{% url 'profile' %}" class="block px-4 py-2 hover:bg-gray-100">Profile</a>
                <a href="{% url 'logout' %}" class="block px-4 py-2 hover:bg-red-100 text-red-600">Logout</a>
            </div>
        </div>
    </div>
</nav>
    <div class="container mx-auto p-6">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
