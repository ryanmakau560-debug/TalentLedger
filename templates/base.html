<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalentLedger</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-600 text-white p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="{% url 'home' %}" class="text-xl font-bold">TalentLedger</a>
            
            <div class="flex gap-4 items-center">
                 <a href="{% url 'display' %}" class="hover:text-blue-200">Home</a>
                
                {% if user.is_authenticated %}
                    <a href="{% url 'dashboard' %}" class="hover:text-blue-200">Dashboard</a>
                    <a href="{% url 'skills' %}" class="text-white hover:text-blue-600">Skills Marketplace</a>
                    <a href="{% url 'profile' %}" class="text-white hover:text-blue-600">Profile</a>
                    
                    <form action="{% url 'logout' %}" method="post" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="hover:text-blue-200">Logout</button>
                    </form>
                    
                {% else %}
                    <a href="{% url 'login' %}" class="hover:text-blue-200">Login</a>
                    <a href="{% url 'register' %}" class="hover:text-blue-200">Sign Up</a>
                {% endif %}
               
                <a href="{% url 'about' %}" class="text-white hover:text-blue-600">About Us</a>
<a href="{% url 'subscription' %}" class="text-white hover:text-blue-600">Subscription</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-6">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
