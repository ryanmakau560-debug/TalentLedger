{% extends 'base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-6">My Dashboard</h1>
    
    <div class="grid gap-4">
        {% for skill in the_skills %}
            <div class="p-4 bg-white shadow rounded-lg">
                <h2 class="text-xl font-semibold">{{ skill.name }}</h2>
                <p class="text-gray-600">Category: {{ skill.category }}</p>
            </div>
        {% empty %}
            <p>You haven't added any skills yet.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
